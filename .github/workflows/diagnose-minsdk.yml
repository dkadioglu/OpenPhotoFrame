name: Diagnose minSdk

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Gradle dependency tree (debugRuntimeClasspath)
        working-directory: android
        run: |
          ./gradlew :app:dependencies \
            --configuration debugRuntimeClasspath \
            --no-daemon \
            2>&1 | tee /tmp/dependency-tree.txt
          echo "--- Lines mentioning minSdk ---"
          grep -i "minsdk\|min-sdk\|min_sdk" /tmp/dependency-tree.txt || true

      - name: Gradle dependency insight – search for minSdk-24 libraries
        working-directory: android
        run: |
          ./gradlew :app:dependencyInsight \
            --configuration debugRuntimeClasspath \
            --dependency "photo_manager" \
            --no-daemon \
            2>&1 | tee /tmp/insight-photo_manager.txt || true
          ./gradlew :app:dependencyInsight \
            --configuration debugRuntimeClasspath \
            --dependency "permission_handler" \
            --no-daemon \
            2>&1 | tee /tmp/insight-permission_handler.txt || true
          ./gradlew :app:dependencyInsight \
            --configuration debugRuntimeClasspath \
            --dependency "file_picker" \
            --no-daemon \
            2>&1 | tee /tmp/insight-file_picker.txt || true

      - name: Build debug APK (produces manifest merger log)
        working-directory: android
        run: |
          ./gradlew :app:processDebugManifest \
            --no-daemon \
            --info \
            2>&1 | tee /tmp/process-manifest.txt
          echo "--- Lines mentioning minSdk or uses-sdk ---"
          grep -i "minsdk\|min-sdk\|uses-sdk\|minSdkVersion\|Merging.*manifest\|manifest.*conflict\|ERROR\|WARNING" \
            /tmp/process-manifest.txt || true

      - name: Show merged manifest
        run: |
          MERGED="android/app/build/intermediates/merged_manifests/debug/processDebugManifest/merged/AndroidManifest.xml"
          if [[ -f "$MERGED" ]]; then
            echo "=== Merged AndroidManifest.xml ==="
            cat "$MERGED"
          else
            echo "Merged manifest not found at expected path; listing candidates:"
            find android/app/build -name "AndroidManifest.xml" 2>/dev/null || true
          fi

      - name: Show manifest merger report
        run: |
          REPORT="android/app/build/outputs/logs/manifest-merger-debug-report.txt"
          if [[ -f "$REPORT" ]]; then
            echo "=== manifest-merger-debug-report.txt ==="
            cat "$REPORT"
          else
            echo "Manifest merger report not found at expected path; listing candidates:"
            find android/app/build/outputs/logs -type f 2>/dev/null || true
          fi

      - name: Collect diagnostic artifacts
        if: always()
        run: |
          mkdir -p /tmp/minsdk-diagnostics
          cp /tmp/dependency-tree.txt /tmp/minsdk-diagnostics/ 2>/dev/null || true
          cp /tmp/process-manifest.txt /tmp/minsdk-diagnostics/ 2>/dev/null || true
          cp /tmp/insight-*.txt /tmp/minsdk-diagnostics/ 2>/dev/null || true
          # Manifest merger report
          REPORT="android/app/build/outputs/logs/manifest-merger-debug-report.txt"
          [[ -f "$REPORT" ]] && cp "$REPORT" /tmp/minsdk-diagnostics/ || true
          # Merged manifest
          find android/app/build/intermediates/merged_manifests -name "AndroidManifest.xml" \
            -exec cp {} /tmp/minsdk-diagnostics/merged-AndroidManifest.xml \; 2>/dev/null || true

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minsdk-diagnostics
          path: /tmp/minsdk-diagnostics/
          retention-days: 14
