name: Diagnose minSdk

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: "stable"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Verify Android Gradle wrapper exists
        run: |
          ls -la
          ls -la android
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Gradle dependency tree (debugRuntimeClasspath)
        run: |
          ./android/gradlew -p android :app:dependencies \
            --configuration debugRuntimeClasspath \
            --no-daemon \
            2>&1 | tee /tmp/dependency-tree.txt
          echo "--- Lines mentioning minSdk ---"
          grep -i "minsdk\|min-sdk\|min_sdk" /tmp/dependency-tree.txt || true

      - name: Gradle dependency insight - photo_manager
        run: |
          ./android/gradlew -p android :app:dependencyInsight \
            --configuration debugRuntimeClasspath \
            --dependency "photo_manager" \
            --no-daemon \
            2>&1 | tee /tmp/insight-photo_manager.txt || true

      - name: Gradle dependency insight - permission_handler
        run: |
          ./android/gradlew -p android :app:dependencyInsight \
            --configuration debugRuntimeClasspath \
            --dependency "permission_handler" \
            --no-daemon \
            2>&1 | tee /tmp/insight-permission_handler.txt || true

      - name: Gradle dependency insight - file_picker
        run: |
          ./android/gradlew -p android :app:dependencyInsight \
            --configuration debugRuntimeClasspath \
            --dependency "file_picker" \
            --no-daemon \
            2>&1 | tee /tmp/insight-file_picker.txt || true

      - name: Process debug manifest
        run: |
          ./android/gradlew -p android :app:processDebugManifest \
            --no-daemon \
            --info \
            2>&1 | tee /tmp/process-manifest.txt
          echo "--- Lines mentioning minSdk or uses-sdk ---"
          grep -i "minsdk\|min-sdk\|uses-sdk\|minSdkVersion\|Merging.*manifest\|manifest.*conflict\|cannot be smaller than version\|ERROR\|WARNING" \
            /tmp/process-manifest.txt || true

      - name: Assemble debug APK
        run: |
          ./android/gradlew -p android :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee /tmp/assemble-debug.txt || true
          echo "--- Lines mentioning minSdk or uses-sdk during assembleDebug ---"
          grep -i "minsdk\|min-sdk\|uses-sdk\|minSdkVersion\|manifest.*conflict\|cannot be smaller than version\|ERROR\|WARNING" \
            /tmp/assemble-debug.txt || true

      - name: Show merged manifests
        if: always()
        run: |
          FOUND=0
          while IFS= read -r manifest; do
            FOUND=1
            echo "=== $manifest ==="
            cat "$manifest"
            echo
          done < <(find android/app/build/intermediates -path "*merged_manifests*" -name "AndroidManifest.xml" 2>/dev/null | sort)

          if [[ "$FOUND" -eq 0 ]]; then
            echo "Merged manifest not found; listing candidates under android/app/build:"
            find android/app/build -name "AndroidManifest.xml" 2>/dev/null || true
          fi

      - name: Show manifest merger reports
        if: always()
        run: |
          FOUND=0
          while IFS= read -r report; do
            FOUND=1
            echo "=== $report ==="
            cat "$report"
            echo
          done < <(find android/app/build -path "*outputs/logs*" -type f \( -name "*manifest*" -o -name "*merger*" -o -name "*.txt" \) 2>/dev/null | sort)

          if [[ "$FOUND" -eq 0 ]]; then
            echo "Manifest merger report not found; listing available log files:"
            find android/app/build -path "*outputs/logs*" -type f 2>/dev/null || true
          fi

      - name: Collect diagnostic artifacts
        if: always()
        run: |
          mkdir -p /tmp/minsdk-diagnostics
          cp /tmp/dependency-tree.txt /tmp/minsdk-diagnostics/ 2>/dev/null || true
          cp /tmp/process-manifest.txt /tmp/minsdk-diagnostics/ 2>/dev/null || true
          cp /tmp/assemble-debug.txt /tmp/minsdk-diagnostics/ 2>/dev/null || true
          cp /tmp/insight-*.txt /tmp/minsdk-diagnostics/ 2>/dev/null || true

          find android/app/build -path "*outputs/logs*" -type f \
            -exec cp {} /tmp/minsdk-diagnostics/ \; 2>/dev/null || true

          find android/app/build/intermediates -path "*merged_manifests*" -name "AndroidManifest.xml" \
            -exec sh -c 'cp "$1" "/tmp/minsdk-diagnostics/$(basename "$(dirname "$1")")-AndroidManifest.xml"' _ {} \; 2>/dev/null || true

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minsdk-diagnostics
          path: /tmp/minsdk-diagnostics/
          retention-days: 14
